name: Build and Deploy Cloud Run Jobs

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: treasury-datamart-sandbox
  REGION: us-central1
  REPOSITORY: treasury-bq-jobs
  IMAGE: treasury-bq-jobs

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ github.sha }}
          docker build -t $IMAGE_TAG .
          docker push $IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Deploy fx-rate-sync-job
        run: |
          gcloud run jobs update fx-rate-sync-job \
            --image $IMAGE_TAG \
            --region $REGION \
            --command python,-m,jobs.fx_rate.main \
            --set-secrets=TABLEAU_PAT_NAME=tableau-pat-name:latest,TABLEAU_PAT_SECRET=tableau-pat-secret:latest \
            --service-account treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --max-retries 3 \
            || gcloud run jobs create fx-rate-sync-job \
            --image $IMAGE_TAG \
            --region $REGION \
            --command python,-m,jobs.fx_rate.main \
            --set-secrets=TABLEAU_PAT_NAME=tableau-pat-name:latest,TABLEAU_PAT_SECRET=tableau-pat-secret:latest \
            --service-account treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --max-retries 3

      - name: Deploy treasury-summary-job
        run: |
          gcloud run jobs update treasury-summary-job \
            --image $IMAGE_TAG \
            --region $REGION \
            --command python,-m,jobs.treasury_summary.main \
            --set-secrets=TABLEAU_PAT_NAME=tableau-pat-name:latest,TABLEAU_PAT_SECRET=tableau-pat-secret:latest \
            --service-account treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --max-retries 3 \
            || gcloud run jobs create treasury-summary-job \
            --image $IMAGE_TAG \
            --region $REGION \
            --command python,-m,jobs.treasury_summary.main \
            --set-secrets=TABLEAU_PAT_NAME=tableau-pat-name:latest,TABLEAU_PAT_SECRET=tableau-pat-secret:latest \
            --service-account treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --max-retries 3

      - name: Create or update Cloud Scheduler (fx-rate-sync)
        run: |
          gcloud scheduler jobs update http fx-rate-sync-daily \
            --schedule "30 8 * * *" \
            --time-zone UTC \
            --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/fx-rate-sync-job:run" \
            --http-method POST \
            --oauth-service-account-email treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --location $REGION \
            || gcloud scheduler jobs create http fx-rate-sync-daily \
            --schedule "30 8 * * *" \
            --time-zone UTC \
            --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/fx-rate-sync-job:run" \
            --http-method POST \
            --oauth-service-account-email treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --location $REGION

      - name: Create or update Cloud Scheduler (treasury-summary)
        run: |
          gcloud scheduler jobs update http treasury-summary-daily \
            --schedule "0 10 * * *" \
            --time-zone UTC \
            --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/treasury-summary-job:run" \
            --http-method POST \
            --oauth-service-account-email treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --location $REGION \
            || gcloud scheduler jobs create http treasury-summary-daily \
            --schedule "0 10 * * *" \
            --time-zone UTC \
            --uri "https://${{ env.REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ env.PROJECT_ID }}/jobs/treasury-summary-job:run" \
            --http-method POST \
            --oauth-service-account-email treasury-bq-jobs@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --location $REGION
